[project]
name = "life-controller-backend"
version = "0.1.0"
description = "Life Controller backend (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.1,<3.2",
    "django-environ>=0.11,<0.12",
    "django-cors-headers>=4.3,<4.4",
    "celery>=5.4,<5.5",
    "redis>=5.0,<5.1",
    "granian[reload]>=1.4,<2.0",
    "django-storages[s3]>=1.14,<1.15",
    "python-dateutil>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<4.9",
    "ruff>=0.6,<0.7",
    "model-bakery>=1.19,<1.20",
    "faker>=26.0,<27.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
